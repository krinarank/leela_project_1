{% extends 'menu/base.html' %}


{% block content %}
<h2>Order #{{ order.id }} Status Tracker</h2>

<ul class="progressbar">
    {% for step in steps %}
        <li class="{% if forloop.counter0 <= current_index %}active{% endif %}">
            {{ step|title }}  {# cut filter hataavi ne #}
            

        </li>
    {% endfor %}
</ul>

<style>
.progressbar {
  display: flex;
  justify-content: space-between;
  list-style-type: none;
  padding: 0;
  margin: 30px 0;
  counter-reset: step;
}

.progressbar li {
  position: relative;
  text-align: center;
  flex: 1;
  color: gray;
}

.progressbar li:before {
  content: counter(step);
  counter-increment: step;
  width: 30px;
  height: 30px;
  line-height: 30px;
  border: 2px solid gray;
  display: block;
  text-align: center;
  margin: 0 auto 10px auto;
  border-radius: 50%;
  background-color: white;
  z-index: 1;
}

.progressbar li.active {
  color: green;
}

.progressbar li.active:before {
  border-color: green;
  background-color: green;
  color: white;
}

.progressbar li:after {
  content: '';
  position: absolute;
  width: 100%;
  height: 4px;
  background-color: gray;
  top: 15px;
  left: -50%;
  z-index: 0;
}

.progressbar li:first-child:after {
  content: none;
}

.progressbar li.active + li:after {
  background-color: green;
}
</style>
{% endblock %}
