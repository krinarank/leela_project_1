<div class="card">
  <h5 class="mb-3">🔐 Change Password</h5>

  {% if errors %}
  <div class="alert alert-danger">
    <ul class="mb-0">{% for e in errors %}<li>❌ {{ e }}</li>{% endfor %}</ul>
  </div>
  {% endif %}

  <form method="POST" action="{% url 'customer_change_password' %}">
    {% csrf_token %}
    <div class="mb-3"><label>Current Password</label><input type="password" name="old_password" class="form-control" required></div>
    <div class="mb-3">
      <label>New Password</label>
      <input type="password" name="new_password" id="newPassword" class="form-control" required onkeyup="checkPasswordStrength()">
      <div class="progress mt-2" style="height: 6px;"><div id="strengthBar" class="progress-bar"></div></div>
      <ul class="mt-2 small" id="passwordRules">
        <li id="rule-length">❌ At least 8 characters</li>
        <li id="rule-upper">❌ At least uppercase letter</li>
        <li id="rule-lower">❌ At least lowercase letter</li>
        <li id="rule-number">❌ At least number</li>
      </ul>
    </div>
    <div class="mb-3"><label>Confirm New Password</label><input type="password" name="confirm_password" class="form-control" required></div>
    <button type="submit" class="btn btn-warning" id="changePwBtn" disabled>Change Password</button>
  </form>
</div>

<script>
function checkPasswordStrength() {
  const pw = document.getElementById("newPassword").value;
  const bar = document.getElementById("strengthBar");
  const btn = document.getElementById("changePwBtn");
  let strength = 0;
  const hasLength = pw.length >= 8;
  const hasUpper  = /[A-Z]/.test(pw);
  const hasLower  = /[a-z]/.test(pw);
  const hasNumber = /\d/.test(pw);
  toggleRule("rule-length", hasLength);
  toggleRule("rule-upper", hasUpper);
  toggleRule("rule-lower", hasLower);
  toggleRule("rule-number", hasNumber);
  if (hasLength) strength++;
  if (hasUpper) strength++;
  if (hasLower) strength++;
  if (hasNumber) strength++;
  if (strength <= 1) { bar.style.width="25%"; bar.className="progress-bar bg-danger"; btn.disabled=true;}
  else if(strength==2 || strength==3){bar.style.width="60%"; bar.className="progress-bar bg-warning"; btn.disabled=true;}
  else{bar.style.width="100%"; bar.className="progress-bar bg-success"; btn.disabled=false;}
}
function toggleRule(id, condition){const el=document.getElementById(id); el.innerHTML=condition?"✅ "+el.innerText.slice(2):"❌ "+el.innerText.slice(2);}
</script>
