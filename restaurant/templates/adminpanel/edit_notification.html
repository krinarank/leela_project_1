
{% extends 'adminpanel/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'menu/css/notification.css' %}">

<div class="notification-wrapper">
    <div class="notification-form">
        <h2>✏️ Edit Notification - {{ notif.title }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Update Notification</button>
            <a href="{% url 'admin_notifications' %}" class="btn-secondary">Back</a>
        </form>
    </div>
</div>
{% endblock %}
