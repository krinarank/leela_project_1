{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width:400px; border-radius:15px;">
        
        <h4 class="text-center mb-3">Reset Password</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <input type="password" name="password" id="password"
                       class="form-control"
                       placeholder="New Password" required>
            </div>

            <!-- Strength Bar -->
            <div class="progress mb-2" style="height:8px;">
                <div id="strength-bar" class="progress-bar"></div>
            </div>
            <small id="strength-text"></small>

            <div class="mb-3 mt-3">
                <input type="password" name="confirm_password"
                       class="form-control"
                       placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Reset Password
            </button>
        </form>

    </div>
</div>

<script>
let password = document.getElementById("password");
let bar = document.getElementById("strength-bar");
let text = document.getElementById("strength-text");

password.addEventListener("input", function(){
    let value = password.value;
    let strength = 0;

    if(value.length >= 8) strength++;
    if(/[A-Z]/.test(value)) strength++;
    if(/[0-9]/.test(value)) strength++;
    if(/[!@#$%^&*]/.test(value)) strength++;

    if(strength === 0){
        bar.style.width = "0%";
        text.innerText = "";
    }
    else if(strength === 1){
        bar.style.width = "25%";
        bar.className = "progress-bar bg-danger";
        text.innerText = "Weak";
    }
    else if(strength === 2){
        bar.style.width = "50%";
        bar.className = "progress-bar bg-warning";
        text.innerText = "Medium";
    }
    else if(strength === 3){
        bar.style.width = "75%";
        bar.className = "progress-bar bg-info";
        text.innerText = "Strong";
    }
    else{
        bar.style.width = "100%";
        bar.className = "progress-bar bg-success";
        text.innerText = "Very Strong";
    }
});
</script>

</body>
</html>
