<!DOCTYPE html>
<html>
<head>
    <title>Admin Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 380px;
    background: #f4f6f8;
    border-radius: 30px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
}

h2 {
    margin-bottom: 25px;
    font-weight: 700;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    outline: none;
    margin-bottom: 15px;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(135deg, #2653d9, #1fd1c3);
}

input::placeholder {
    color: #eaffff;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 10px 25px rgba(36,91,255,0.6);
}

.message {
    margin-bottom: 15px;
    color: red;
}
</style>
</head>

<body>
<div class="card">
    <h2>Admin Forgot Password</h2>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Enter Admin Username" required>
        <button type="submit">Send OTP</button>
    </form>
</div>
</body>
</html>
