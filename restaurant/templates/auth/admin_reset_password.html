<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 380px;
    background: #f4f6f8;
    border-radius: 30px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
}

h2 {
    margin-bottom: 20px;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    outline: none;
    margin-bottom: 12px;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(135deg, #2653d9, #1fd1c3);
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #245bff, #1fd1c3);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 10px 25px rgba(36,91,255,0.6);
}

.message {
    margin-bottom: 10px;
    color: red;
}

.strength {
    font-size: 14px;
    margin-bottom: 10px;
}
</style>
</head>

<body>
<div class="card">
    <h2>Reset Admin Password</h2>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <input type="password" id="password" name="password" placeholder="New Password" required>
        <div class="strength" id="strengthText"></div>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Reset Password</button>
    </form>
</div>

<script>
let password = document.getElementById("password");
let strengthText = document.getElementById("strengthText");

password.addEventListener("input", function(){
    let val = password.value;
    let strength = "Weak";

    if(val.length >= 8 && /\d/.test(val) && /[!@#$%^&*]/.test(val)){
        strength = "Strong";
        strengthText.style.color = "green";
    } else {
        strengthText.style.color = "red";
    }

    strengthText.innerText = "Password Strength: " + strength;
});
</script>

</body>
</html>
