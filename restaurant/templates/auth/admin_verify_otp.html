{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {background: #186deb; display:flex; justify-content:center; align-items:center; height:100vh;}
        .card {padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);}
        .form-control {text-align:center; font-weight:bold; font-size:18px;}
        #resend-btn {display:none;}
    </style>
</head>
<body>

<div class="card">

    <h4 class="text-center mb-3">Verify OTP</h4>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" id="otp-form">
        {% csrf_token %}
        <input type="text" name="otp" maxlength="6" pattern="\d{6}"
               class="form-control mb-3"
               placeholder="Enter 6-digit OTP"
               required
               oninput="this.value=this.value.replace(/[^0-9]/g,''); checkAutoSubmit(this)">
        <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
    </form>

    <div class="text-center mt-3">
        <span id="timer-text">Resend OTP in <span id="countdown">60</span>s</span>
        <a href="{% url 'customer_resend_otp' %}" id="resend-btn" class="text-primary d-block mt-2">Resend OTP</a>
    </div>

</div>

<script>
let seconds = 60;
let countdown = document.getElementById("countdown");
let resendBtn = document.getElementById("resend-btn");
let timerText = document.getElementById("timer-text");

let timer = setInterval(function(){
    seconds--;
    countdown.innerText = seconds;
    if(seconds <= 0){
        clearInterval(timer);
        timerText.style.display = "none";
        resendBtn.style.display = "block";
    }
},1000);

// Optional: auto-submit form after 6 digits
function checkAutoSubmit(input) {
    if(input.value.length == 6){
        document.getElementById('otp-form').submit();
    }
}
</script>

</body>
</html>
