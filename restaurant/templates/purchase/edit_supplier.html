{% extends 'adminpanel/base.html' %}
{% load static %}
{% block content %}

<div class="supplier-container">
    <div class="supplier-form">

        <h3>Update Supplier</h3>

        {% if messages %}
        <div class="toast-container">
            {% for message in messages %}
                <div class="toast success">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <!-- First Name -->
            <input type="text" name="fname" value="{{ supplier.fname }}" required
                pattern="[A-Za-z\s]{2,50}" title="Enter valid first name (letters only, 2-50 characters)">

            <!-- Last Name -->
            <input type="text" name="lname" value="{{ supplier.lname }}" required
                pattern="[A-Za-z\s]{2,50}" title="Enter valid last name (letters only, 2-50 characters)">

            <!-- Contact Number -->
            <input type="tel" name="contact_no" value="{{ supplier.contact_no }}" required
                pattern="[0-9]{10}" title="Enter 10-digit contact number">

            <!-- Email -->
            <input type="email" name="email" value="{{ supplier.email }}" required
                title="Enter a valid email address">

            <!-- Address -->
            <textarea name="address" required minlength="5" maxlength="200"
                title="Enter address (5-200 characters)">{{ supplier.address }}</textarea>

            <!-- Area -->
            <select name="area" required>
                {% for area in areas %}
                <option value="{{ area.id }}"
                    {% if supplier.area.id == area.id %}selected{% endif %}>
                    {{ area.name }} - {{ area.city.name }}
                </option>
                {% endfor %}
            </select>

            <button type="submit" class="btn">Update Supplier</button>
        </form>

    </div>
</div>

<link rel="stylesheet" href="{% static 'purchase/css/supplier_page.css' %}">

{% endblock %}
